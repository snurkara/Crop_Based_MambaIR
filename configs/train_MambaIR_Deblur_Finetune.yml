name: MambaIR_Deblur_Finetune
model_type: MambaIRModel
scale: 1
num_gpu: 1
manual_seed: 42

datasets:
  train:
    name: DeblurTrain
    type: PairedImageDataset
    dataroot_gt: /content/drive/MyDrive/SAYZEK-ATP/New_Dataset_Splitted_for_Finetune/train/sharp
    dataroot_lq: /content/drive/MyDrive/SAYZEK-ATP/New_Dataset_Splitted_for_Finetune/train/blur
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 64
    use_hflip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 10
    prefetch_mode: ~
  val:
    name: DeblurVal
    type: PairedImageDataset
    dataroot_gt: /content/drive/MyDrive/SAYZEK-ATP/New_Dataset_Splitted_for_Finetune/val/sharp
    dataroot_lq: /content/drive/MyDrive/SAYZEK-ATP/New_Dataset_Splitted_for_Finetune/val/blur
    io_backend:
      type: disk

network_g:
  type: MambaIR
  upscale: 1
  in_chans: 3
  img_size: 128
  img_range: 1.
  d_state: 16
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  mlp_ratio: 1.2

path:
  pretrain_network_g: /content/drive/MyDrive/SAYZEK-ATP/MambaIR/experiments/pretrained_models/ColorDN_MambaIR_level25.pth
  strict_load_g: true
  resume_state: /content/drive/MyDrive/SAYZEK-ATP/MambaIR/experiments/MambaIR_Deblur_Finetune/training_states/3000.state
train:
  optim_g:
    type: Adam
    lr: !!float 5e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [8000]
    restart_weights: [1]
    eta_min: !!float 1e-7
  total_iter: 8000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 1000
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1000
  save_latest_freq: !!float 500
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
